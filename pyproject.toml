[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-ext"
version = "0.1.0"
description = "Notion aynası ve yerel hibrit hafıza araması"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
semantic = ["fastembed>=0.9,<1", "numpy>=2,<3", "sqlite-vec>=0.1.9,<0.2"]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[project.scripts]
brainext = "brainext.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: yalnız açık onayla gerçek cached model testi"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
